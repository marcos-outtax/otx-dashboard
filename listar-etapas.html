<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Etapas dos Funis — RD Station</title>
<style>
body{font-family:Inter,sans-serif;background:#f0f4fb;padding:24px;color:#152c6b;}
h1{font-size:18px;margin-bottom:4px;}
p{font-size:12px;color:#5a6e99;margin-bottom:20px;}
.funil{background:#fff;border-radius:12px;border:1px solid #d6e0f0;margin-bottom:16px;overflow:hidden;}
.funil-titulo{background:#152c6b;color:#fff;padding:12px 16px;font-size:13px;font-weight:600;}
.etapa{padding:10px 16px;border-bottom:1px solid #f0f4fb;font-size:12px;display:flex;gap:12px;align-items:center;}
.etapa:last-child{border-bottom:none;}
.etapa-nome{font-weight:500;flex:1;}
.etapa-id{color:#9e9e9e;font-size:10px;}
.loading{text-align:center;padding:40px;color:#5a6e99;}
.erro{color:#791F1F;padding:16px;}
button{background:#152c6b;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;margin-bottom:20px;}
button:hover{background:#285199;}
input{padding:8px 12px;border:1px solid #d6e0f0;border-radius:8px;font-size:12px;width:300px;margin-right:8px;}
</style>
</head>
<body>
<h1>🔍 Etapas dos Funis — RD Station CRM</h1>
<p>Use esta página para ver todas as etapas de cada funil e identificar quais representam "reunião realizada".</p>

<div>
  <input type="password" id="token" placeholder="Cole seu token do RD Station aqui..."/>
  <button onclick="carregar()">Carregar funis</button>
</div>

<div id="resultado" class="loading">Insira seu token e clique em Carregar.</div>

<script>
// Tenta pegar o token salvo no dashboard
try {
  const cfg = JSON.parse(localStorage.getItem('otx_cfg') || '{}');
  if (cfg.rd) document.getElementById('token').value = cfg.rd;
} catch(e) {}

async function carregar() {
  const token = document.getElementById('token').value.trim();
  if (!token) { alert('Insira o token do RD Station'); return; }

  document.getElementById('resultado').innerHTML = '<div class="loading">⏳ Buscando funis e etapas...</div>';

  try {
    // Busca todos os funis (pipelines)
    const rPipelines = await fetch(`/api/rd?path=deal_pipelines&token=${token}`);
    const dPipelines = await rPipelines.json();
    const pipelines = dPipelines.deal_pipelines || [];

    if (!pipelines.length) {
      document.getElementById('resultado').innerHTML = '<div class="erro">Nenhum funil encontrado. Verifique o token.</div>';
      return;
    }

    // Busca etapas de cada funil
    let html = '';
    for (const p of pipelines) {
      const rStages = await fetch(`/api/rd?path=deals/stages&deal_pipeline_id=${p.id}&token=${token}`);
      const dStages = await rStages.json();
      const stages = dStages.deal_stages || [];

      html += `<div class="funil">
        <div class="funil-titulo">📋 ${p.name} <span style="font-size:10px;opacity:.6;">(id: ${p.id})</span></div>`;

      if (stages.length) {
        stages.forEach((s, i) => {
          html += `<div class="etapa">
            <span style="background:#e8eef8;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;">${i+1}</span>
            <span class="etapa-nome">${s.name}</span>
            <span class="etapa-id">id: ${s.id}</span>
          </div>`;
        });
      } else {
        html += `<div class="etapa" style="color:#9e9e9e;">Nenhuma etapa encontrada</div>`;
      }

      html += '</div>';
    }

    document.getElementById('resultado').innerHTML = html;

  } catch(e) {
    document.getElementById('resultado').innerHTML = `<div class="erro">Erro: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
