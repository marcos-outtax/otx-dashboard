<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Etapas dos Funis — RD Station</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,sans-serif;background:#f0f4fb;padding:24px;color:#152c6b;}
h1{font-size:18px;margin-bottom:4px;}
.sub{font-size:12px;color:#5a6e99;margin-bottom:20px;}
.funil{background:#fff;border-radius:12px;border:1px solid #d6e0f0;margin-bottom:16px;overflow:hidden;break-inside:avoid;}
.funil-titulo{background:#152c6b;color:#fff;padding:12px 16px;font-size:13px;font-weight:600;}
.etapa{padding:10px 16px;border-bottom:1px solid #f0f4fb;font-size:12px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:background .15s;}
.etapa:last-child{border-bottom:none;}
.etapa:hover{background:#f8f9ff;}
.etapa.marcada{background:#e8f5e9;}
.etapa.marcada .etapa-nome{color:#1D9E75;font-weight:600;}
.etapa-num{background:#e8eef8;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;min-width:24px;text-align:center;flex-shrink:0;}
.etapa-nome{flex:1;}
.etapa-id{color:#ccc;font-size:10px;}
.check{width:20px;height:20px;border-radius:4px;border:2px solid #d6e0f0;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.etapa.marcada .check{background:#1D9E75;border-color:#1D9E75;color:#fff;}
.loading{text-align:center;padding:40px;color:#5a6e99;font-size:13px;}
.erro{color:#791F1F;padding:16px;background:#fff;border-radius:8px;}
.topo{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
button{background:#152c6b;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;}
button:hover{background:#285199;}
.btn-imp{background:#FF8E2A;}
.btn-imp:hover{background:#e07820;}
.btn-limpar{background:#fff;color:#152c6b;border:1px solid #d6e0f0;}
.btn-limpar:hover{background:#f0f4fb;}
input{padding:8px 12px;border:1px solid #d6e0f0;border-radius:8px;font-size:12px;width:280px;}
.legenda{font-size:11px;color:#5a6e99;padding:8px 16px;background:#f8f9ff;border-top:1px solid #f0f4fb;}
@media print{
  .topo,.sub{display:none;}
  body{background:#fff;padding:12px;}
  .funil{break-inside:avoid;margin-bottom:12px;}
  .etapa{padding:8px 12px;}
  .btn-imp,.btn-limpar{display:none;}
}
</style>
</head>
<body>
<h1>🔍 Etapas dos Funis — RD Station CRM</h1>
<p class="sub">Clique nas etapas para marcar as que representam "Reunião Realizada", depois imprima.</p>

<div class="topo">
  <input type="password" id="token" placeholder="Token do RD Station..."/>
  <button onclick="carregar()">🔄 Carregar funis</button>
  <button class="btn-imp" onclick="window.print()">🖨️ Imprimir</button>
  <button class="btn-limpar" onclick="limparMarcacoes()">✕ Limpar marcações</button>
</div>

<div id="resultado" class="loading">Insira o token e clique em Carregar.</div>

<script>
try{const cfg=JSON.parse(localStorage.getItem('otx_cfg')||'{}');if(cfg.rd)document.getElementById('token').value=cfg.rd;}catch(e){}

const FUNIS=[
  {id:'6706b83df4cf270013213222',nome:'📥 Pré-vendas [Inbound]'},
  {id:'6706b8464c9f220026c047c1',nome:'💼 Vendas Contabilidade'},
  {id:'65c4078fa051670017a8b25d',nome:'📊 Vendas BPO Financeiro'},
  {id:'671931f51da141001338787c',nome:'🏥 Projeto 360 + Médicos'},
  {id:'689c91211ee005001ae35f53',nome:'💰 Vendas 360 + Médicos'},
  {id:'689c9195890719001dedb952',nome:'⏳ Oportunidades +30D'},
];

async function rdGet(path,params={}){
  const token=document.getElementById('token').value.trim();
  const qs=Object.keys(params).length?'&'+new URLSearchParams(params):'';
  const r=await fetch('/api/rd?path='+encodeURIComponent(path)+qs,{
    headers:{'Content-Type':'application/json','X-RD-Token':token}
  });
  return r.json();
}

function toggleEtapa(el){
  el.classList.toggle('marcada');
  el.querySelector('.check').innerHTML=el.classList.contains('marcada')?'✓':'';
}

function limparMarcacoes(){
  document.querySelectorAll('.etapa.marcada').forEach(el=>{
    el.classList.remove('marcada');
    el.querySelector('.check').innerHTML='';
  });
}

async function carregar(){
  const token=document.getElementById('token').value.trim();
  if(!token){alert('Insira o token');return;}
  document.getElementById('resultado').innerHTML='<div class="loading">⏳ Buscando etapas de cada funil...</div>';

  try{
    let html='';

    for(const funil of FUNIS){
      // Tenta buscar stages diretamente
      const dS=await rdGet('deals/stages',{deal_pipeline_id:funil.id});
      let stages=dS.deal_stages||[];

      // Fallback: extrai estágios dos deals do funil
      if(!stages.length){
        const pages=await Promise.all([1,2,3,4,5].map(p=>
          rdGet('deals',{deal_pipeline_id:funil.id,page:String(p)})
        ));
        const deals=pages.flatMap(p=>p.deals||[]);
        const map={};
        deals.forEach(d=>{
          if(d.deal_stage?.id&&!map[d.deal_stage.id])
            map[d.deal_stage.id]={id:d.deal_stage.id,name:d.deal_stage.name};
        });
        stages=Object.values(map);
      }

      html+=`<div class="funil">
        <div class="funil-titulo">${funil.nome}</div>`;

      if(stages.length){
        stages.forEach((s,i)=>{
          html+=`<div class="etapa" onclick="toggleEtapa(this)" title="Clique para marcar como Reunião Realizada">
            <span class="etapa-num">${i+1}</span>
            <span class="etapa-nome">${s.name}</span>
            <span class="etapa-id">${s.id}</span>
            <div class="check"></div>
          </div>`;
        });
        html+=`<div class="legenda">✅ = Clique para marcar como "Reunião Realizada"</div>`;
      }else{
        html+=`<div class="etapa" style="color:#9e9e9e;font-style:italic;">Nenhuma etapa encontrada neste funil</div>`;
      }

      html+='</div>';
    }

    document.getElementById('resultado').innerHTML=html;

  }catch(e){
    document.getElementById('resultado').innerHTML=`<div class="erro">Erro: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
