<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Etapas dos Funis — RD Station</title>
<style>
body{font-family:Inter,sans-serif;background:#f0f4fb;padding:24px;color:#152c6b;}
h1{font-size:18px;margin-bottom:4px;}
p{font-size:12px;color:#5a6e99;margin-bottom:20px;}
.funil{background:#fff;border-radius:12px;border:1px solid #d6e0f0;margin-bottom:16px;overflow:hidden;}
.funil-titulo{background:#152c6b;color:#fff;padding:12px 16px;font-size:13px;font-weight:600;}
.etapa{padding:10px 16px;border-bottom:1px solid #f0f4fb;font-size:12px;display:flex;gap:12px;align-items:center;}
.etapa:last-child{border-bottom:none;}
.etapa-nome{font-weight:500;flex:1;}
.etapa-id{color:#9e9e9e;font-size:10px;}
.loading{text-align:center;padding:40px;color:#5a6e99;font-size:13px;}
.erro{color:#791F1F;padding:16px;background:#fff;border-radius:8px;}
button{background:#152c6b;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;margin-bottom:20px;}
button:hover{background:#285199;}
input{padding:8px 12px;border:1px solid #d6e0f0;border-radius:8px;font-size:12px;width:320px;margin-right:8px;}
pre{font-size:10px;background:#f0f4fb;padding:8px;border-radius:4px;overflow:auto;max-height:200px;}
</style>
</head>
<body>
<h1>Etapas dos Funis — RD Station CRM</h1>
<p>Lista todas as etapas de todos os funis.</p>
<div>
  <input type="password" id="token" placeholder="Token do RD Station..."/>
  <button onclick="carregar()">Carregar funis</button>
</div>
<div id="resultado" class="loading">Insira seu token e clique em Carregar.</div>
<script>
try{const cfg=JSON.parse(localStorage.getItem('otx_cfg')||'{}');if(cfg.rd)document.getElementById('token').value=cfg.rd;}catch(e){}
async function rdGet(path,params={}){
  const token=document.getElementById('token').value.trim();
  const qs=Object.keys(params).length?'&'+new URLSearchParams(params):'';
  const r=await fetch('/api/rd?path='+encodeURIComponent(path)+qs,{headers:{'Content-Type':'application/json','X-RD-Token':token}});
  return r.json();
}
async function carregar(){
  const token=document.getElementById('token').value.trim();
  if(!token){alert('Insira o token');return;}
  document.getElementById('resultado').innerHTML='<div class="loading">Buscando funis...</div>';
  try{
    const dP=await rdGet('deal_pipelines');
    const pipelines=dP.deal_pipelines||[];
    if(!pipelines.length){
      document.getElementById('resultado').innerHTML='<div class="erro">Nenhum funil encontrado.<br><pre>'+JSON.stringify(dP,null,2)+'</pre></div>';
      return;
    }
    document.getElementById('resultado').innerHTML='<div class="loading">Buscando etapas...</div>';
    let html='<p style="font-size:12px;color:#5a6e99;margin-bottom:12px;">'+pipelines.length+' funis encontrados:</p>';
    for(const p of pipelines){
      const dS=await rdGet('deals/stages',{deal_pipeline_id:p.id});
      const stages=dS.deal_stages||[];
      html+='<div class="funil"><div class="funil-titulo">'+p.name+' <span style="font-size:10px;opacity:.6;">(id: '+p.id+')</span></div>';
      if(stages.length){
        stages.forEach((s,i)=>{
          html+='<div class="etapa"><span style="background:#e8eef8;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;min-width:24px;text-align:center;">'+(i+1)+'</span><span class="etapa-nome">'+s.name+'</span><span class="etapa-id">id: '+s.id+'</span></div>';
        });
      }else{
        html+='<div class="etapa" style="color:#9e9e9e;">Sem etapas — '+JSON.stringify(dS).substring(0,100)+'</div>';
      }
      html+='</div>';
    }
    document.getElementById('resultado').innerHTML=html;
  }catch(e){
    document.getElementById('resultado').innerHTML='<div class="erro">Erro: '+e.message+'</div>';
  }
}
</script>
</body>
</html>
