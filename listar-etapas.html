<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Etapas dos Funis — RD Station</title>
<style>
body{font-family:Inter,sans-serif;background:#f0f4fb;padding:24px;color:#152c6b;}
h1{font-size:18px;margin-bottom:4px;}
.funil{background:#fff;border-radius:12px;border:1px solid #d6e0f0;margin-bottom:16px;overflow:hidden;}
.funil-titulo{background:#152c6b;color:#fff;padding:12px 16px;font-size:13px;font-weight:600;}
.etapa{padding:10px 16px;border-bottom:1px solid #f0f4fb;font-size:12px;display:flex;gap:12px;align-items:center;}
.etapa:last-child{border-bottom:none;}
.etapa-nome{font-weight:500;flex:1;}
.etapa-id{color:#9e9e9e;font-size:10px;}
.loading{text-align:center;padding:40px;color:#5a6e99;}
.erro{color:#791F1F;padding:16px;background:#fff;border-radius:8px;}
button{background:#152c6b;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;margin-bottom:20px;}
input{padding:8px 12px;border:1px solid #d6e0f0;border-radius:8px;font-size:12px;width:320px;margin-right:8px;}
pre{font-size:10px;background:#f0f4fb;padding:8px;border-radius:4px;overflow:auto;max-height:300px;}
</style>
</head>
<body>
<h1>Etapas dos Funis — RD Station CRM</h1>
<p style="font-size:12px;color:#5a6e99;margin-bottom:20px;">O token já está preenchido automaticamente do dashboard.</p>
<div>
  <input type="password" id="token" placeholder="Token do RD Station..."/>
  <button onclick="carregar()">Carregar funis</button>
</div>
<div id="resultado" class="loading">Clique em Carregar.</div>
<script>
try{const cfg=JSON.parse(localStorage.getItem('otx_cfg')||'{}');if(cfg.rd)document.getElementById('token').value=cfg.rd;}catch(e){}
async function carregar(){
  const token=document.getElementById('token').value.trim();
  if(!token){alert('Insira o token');return;}
  document.getElementById('resultado').innerHTML='<div class="loading">Buscando...</div>';
  try{
    const r=await fetch('/api/rd?path=deal_pipelines',{headers:{'Content-Type':'application/json','X-RD-Token':token}});
    const d=await r.json();

    // As etapas já vêm dentro de deal_pipelines[].deal_stages
    const pipelines=d.deal_pipelines||d.pipelines||[];

    if(!pipelines.length){
      document.getElementById('resultado').innerHTML='<div class="erro">Nenhum funil.<br><pre>'+JSON.stringify(d,null,2).substring(0,600)+'</pre></div>';
      return;
    }

    let html='';
    pipelines.forEach(p=>{
      const stages=p.deal_stages||[];
      html+='<div class="funil"><div class="funil-titulo">'+p.name+' <span style="font-size:10px;opacity:.6;">('+p.id+')</span></div>';
      stages.forEach((s,i)=>{
        html+='<div class="etapa"><span style="background:#e8eef8;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;min-width:20px;text-align:center;">'+(i+1)+'</span><span class="etapa-nome">'+s.name+'</span><span class="etapa-id">'+s.id+'</span></div>';
      });
      html+='</div>';
    });
    document.getElementById('resultado').innerHTML=html;
  }catch(e){
    document.getElementById('resultado').innerHTML='<div class="erro">Erro: '+e.message+'</div>';
  }
}
</script>
</body>
</html>
