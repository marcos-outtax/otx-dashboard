<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Etapas dos Funis — RD Station</title>
<style>
body{font-family:Inter,sans-serif;background:#f0f4fb;padding:24px;color:#152c6b;}
h1{font-size:18px;margin-bottom:8px;}
.funil{background:#fff;border-radius:12px;border:1px solid #d6e0f0;margin-bottom:16px;overflow:hidden;}
.funil-titulo{background:#152c6b;color:#fff;padding:12px 16px;font-size:13px;font-weight:600;}
.etapa{padding:10px 16px;border-bottom:1px solid #f0f4fb;font-size:12px;display:flex;gap:12px;align-items:center;}
.etapa:last-child{border-bottom:none;}
.loading{text-align:center;padding:40px;color:#5a6e99;}
.erro{color:#791F1F;padding:16px;background:#fff;border-radius:8px;}
button{background:#152c6b;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;cursor:pointer;margin-bottom:20px;}
input{padding:8px 12px;border:1px solid #d6e0f0;border-radius:8px;font-size:12px;width:320px;margin-right:8px;}
</style>
</head>
<body>
<h1>🔍 Etapas dos Funis — RD Station CRM</h1>
<div>
  <input type="password" id="token" placeholder="Token do RD Station..."/>
  <button onclick="carregar()">Carregar</button>
</div>
<div id="resultado" class="loading">Insira o token e clique em Carregar.</div>
<script>
try{const cfg=JSON.parse(localStorage.getItem('otx_cfg')||'{}');if(cfg.rd)document.getElementById('token').value=cfg.rd;}catch(e){}

const FUNIS=[
  {id:'6706b83df4cf270013213222',nome:'📥 Pré-vendas [Inbound]'},
  {id:'6706b8464c9f220026c047c1',nome:'💼 Vendas Contabilidade'},
  {id:'65c4078fa051670017a8b25d',nome:'📊 Vendas BPO Financeiro'},
  {id:'671931f51da141001338787c',nome:'🏥 Projeto 360 + Médicos'},
  {id:'689c91211ee005001ae35f53',nome:'💰 Vendas 360 + Médicos'},
  {id:'689c9195890719001dedb952',nome:'⏳ Oportunidades +30D'},
];

async function rdGet(path,params={}){
  const token=document.getElementById('token').value.trim();
  const qs=Object.keys(params).length?'&'+new URLSearchParams(params):'';
  const r=await fetch('/api/rd?path='+encodeURIComponent(path)+qs,{
    headers:{'Content-Type':'application/json','X-RD-Token':token}
  });
  return r.json();
}

async function carregar(){
  const token=document.getElementById('token').value.trim();
  if(!token){alert('Insira o token');return;}
  document.getElementById('resultado').innerHTML='<div class="loading">Buscando estágios de cada funil...</div>';

  try{
    let html='';

    for(const funil of FUNIS){
      document.getElementById('resultado').innerHTML=`<div class="loading">Buscando: ${funil.nome}...</div>`;

      // Busca deals do funil e extrai estágios únicos
      const pages=await Promise.all([1,2,3].map(p=>
        rdGet('deals',{deal_pipeline_id:funil.id,page:String(p)})
      ));
      const deals=pages.flatMap(p=>p.deals||[]);

      // Coleta estágios únicos preservando ordem
      const estagiosMap={};
      deals.forEach(d=>{
        const eId=d.deal_stage?.id||'';
        const eNome=d.deal_stage?.name||'(sem estágio)';
        if(eId&&!estagiosMap[eId]) estagiosMap[eId]=eNome;
      });

      const estagios=Object.entries(estagiosMap);

      html+=`<div class="funil">
        <div class="funil-titulo">${funil.nome} — ${deals.length} deals analisados</div>`;

      if(estagios.length){
        estagios.forEach(([eId,eNome],i)=>{
          html+=`<div class="etapa">
            <span style="background:#e8eef8;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;min-width:20px;text-align:center;">${i+1}</span>
            <span style="font-weight:500;flex:1;">${eNome}</span>
            <span style="color:#9e9e9e;font-size:10px;">${eId}</span>
          </div>`;
        });
      }else{
        html+=`<div class="etapa" style="color:#9e9e9e;font-style:italic;">Nenhum deal encontrado neste funil</div>`;
      }
      html+='</div>';
    }

    document.getElementById('resultado').innerHTML=html;

  }catch(e){
    document.getElementById('resultado').innerHTML=`<div class="erro">Erro: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
